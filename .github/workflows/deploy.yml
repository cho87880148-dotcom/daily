name: 검색어 갱신 + 배포

on:
  # 매시 정각에 인기 검색어를 새로 받아 다시 올립니다
  schedule:
    - cron: '0 * * * *'
  # 파일을 고쳐서 push 하면 바로 반영합니다
  push:
    branches: [main]
  # Actions 탭에서 손으로 실행할 수도 있습니다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않게 합니다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # 검색어 받아오기.
      # 실패해도 배포는 계속합니다 — 저장돼 있던 지난번 검색어가 그대로 나갑니다.
      # (구글이 잠깐 막거나 형식을 바꿔도 앱 전체가 멈추지 않게 하려는 것입니다)
      - name: 인기 검색어 갱신
        continue-on-error: true
        shell: pwsh
        run: ./fetch-trends.ps1

      # 올릴 파일만 따로 모읍니다.
      # .ps1 · worklog · CLAUDE.md 는 올리지 않습니다.
      - name: 올릴 파일 모으기
        shell: bash
        run: |
          mkdir -p _site
          cp index.html app.css app.js manifest.json sw.js robots.txt _site/
          cp icon-*.png _site/
          mkdir -p _site/data
          cp data/*.json _site/data/ 2>/dev/null || true
          echo "--- 올라갈 파일 ---"
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
